<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPU Canteen FastOrder</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{font-family:Prompt,sans-serif;background:linear-gradient(135deg,#fff1f7,#eff6ff)}.card{transition:.2s}.card:hover{transform:translateY(-3px)}</style></head><body class="min-h-screen text-slate-700"><header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-pink-100"><div class="max-w-6xl mx-auto p-4 flex justify-between items-center"><h1 class="font-bold text-xl text-pink-600">🌸 SPU Canteen FastOrder</h1><button onclick="openCart()" class="relative bg-pink-500 text-white px-4 py-2 rounded-2xl">🛒 ตะกร้า <b id="badge" class="absolute -top-2 -right-2 bg-blue-500 rounded-full w-6 h-6 text-xs flex items-center justify-center">0</b></button></div></header><main class="max-w-6xl mx-auto p-4"><section class="rounded-3xl bg-gradient-to-r from-pink-300 to-blue-200 p-7 mb-6"><h2 class="text-2xl md:text-4xl font-bold">หิวตอนพักเที่ยง? สั่งล่วงหน้าได้เลย! 🍱</h2><p class="mt-2">เลือกอาหาร • เลือกเวลารับ • รับแจ้งเตือนเมื่อถึงคิว</p></section><div class="flex gap-2 mb-6"><button class="f bg-pink-500 text-white px-4 py-2 rounded-xl" onclick="filter('all',this)">ทั้งหมด</button><button class="f bg-white px-4 py-2 rounded-xl" onclick="filter('hot',this)">🔥 โรงอาหารร้อน</button><button class="f bg-white px-4 py-2 rounded-xl" onclick="filter('cool',this)">❄️ โรงอาหารเย็น</button></div><div id="grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div></main><div id="drawer" class="hidden fixed inset-0 z-50"><div class="absolute inset-0 bg-black/30" onclick="closeCart()"></div><aside class="absolute right-0 top-0 h-full w-full max-w-md bg-white p-5 overflow-auto"><div class="flex justify-between"><h2 class="text-xl font-bold">🛒 ตะกร้า</h2><button onclick="closeCart()" class="text-2xl">×</button></div><div id="items" class="my-5 space-y-3"></div><select id="pickup" class="w-full border p-3 rounded-xl"><option>11:30</option><option>12:00</option><option>12:30</option><option>13:00</option></select><div class="flex justify-between font-bold text-lg my-4"><span>รวม</span><span id="total">฿0</span></div><button onclick="checkout()" class="w-full bg-pink-500 text-white p-3 rounded-2xl">ยืนยันออร์เดอร์ 🎉</button></aside></div><div id="notice" class="hidden fixed right-4 bottom-4 z-[60] w-[calc(100%-2rem)] max-w-sm bg-white border border-pink-100 shadow-2xl rounded-3xl p-5"><div class="flex justify-between"><div><b class="text-pink-600">🔔 แจ้งเตือนคิว</b><p id="qtext" class="text-sm mt-1"></p></div><button onclick="notice.classList.add('hidden')">×</button></div><div class="h-2 bg-pink-100 rounded mt-4"><div id="bar" class="h-full bg-gradient-to-r from-pink-400 to-blue-400 rounded" style="width:0"></div></div><p id="qdetail" class="text-xs text-slate-500 mt-2"></p><button id="notify" onclick="askNotify()" class="w-full mt-3 bg-blue-500 text-white py-2 rounded-xl">🔔 เปิดการแจ้งเตือน</button></div><script>
const M=[['กะเพราไก่ไข่ดาว',50,'hot'],['กะเพราหมูกรอบ',65,'hot'],['ข้าวมันไก่',50,'hot'],['หมูทอดกระเทียม',55,'hot'],['ข้าวผัดหมู',50,'hot'],['ราดหน้าหมู',50,'hot'],['ผัดซีอิ๊วหมู',50,'hot'],['ก๋วยเตี๋ยวต้มยำ',55,'hot'],['ข้าวหน้าไก่เทอริยากิ',65,'hot'],['ข้าวไข่เจียวหมูสับ',45,'hot'],['ส้มตำไทย',50,'cool'],['ยำวุ้นเส้น',55,'cool'],['สลัดไก่',65,'cool'],['ข้าวยำไก่แซ่บ',60,'cool'],['ชาไทยเย็น',35,'cool'],['โกโก้เย็น',40,'cool'],['ชานมไข่มุก',45,'cool'],['น้ำมะนาว',30,'cool'],['เฟรนช์ฟรายส์',45,'cool'],['ไก่ทอดซอสเกาหลี',75,'hot'],['ข้าวแกงกะหรี่ไก่',70,'hot'],['ข้าวหมูแดง',60,'hot'],['ข้าวขาหมู',65,'hot'],['ขนมจีนน้ำยา',50,'hot'],['นักเก็ตไก่',55,'cool'],['ปังปิ้งเนยนม',35,'cool'],['น้ำแตงโมปั่น',40,'cool'],['น้ำส้มปั่น',40,'cool']];let cart=[],queue=JSON.parse(localStorage.spuQueue||'null'),timer;
function render(t='all'){grid.innerHTML=M.map((x,i)=>[i,x]).filter(a=>t==='all'||a[1][2]===t).map(([i,x])=>`<div class="card bg-white rounded-3xl p-4 shadow-sm"><div class="h-24 rounded-2xl bg-gradient-to-br from-pink-100 to-blue-100 flex items-center justify-center text-4xl">${x[2]==='hot'?'🍛':'🥤'}</div><b>${x[0]}</b><div class="text-pink-600 font-bold">฿${x[1]}</div><button onclick="add(${i})" class="w-full mt-2 bg-pink-100 text-pink-700 py-2 rounded-xl">+ เพิ่ม</button></div>`).join('')}
function filter(t,b){document.querySelectorAll('.f').forEach(x=>x.className='f bg-white px-4 py-2 rounded-xl');b.className='f bg-pink-500 text-white px-4 py-2 rounded-xl';render(t)}function add(i){let x=cart.find(a=>a.i===i);x?x.q++:cart.push({i,q:1});openCart();draw()}function openCart(){drawer.classList.remove('hidden')}function closeCart(){drawer.classList.add('hidden')}function draw(){items.innerHTML=cart.length?cart.map(a=>`<div class="p-3 bg-pink-50 rounded-xl flex justify-between"><span>${M[a.i][0]} × ${a.q}</span><button onclick="cart=cart.filter(x=>x.i!==${a.i});draw()" class="text-red-500">ลบ</button></div>`).join(''):'<p class="text-center text-slate-400 py-10">ยังไม่มีสินค้า</p>';let s=cart.reduce((a,x)=>a+M[x.i][1]*x.q,0);total.textContent='฿'+s;badge.textContent=cart.reduce((a,x)=>a+x.q,0)}function askNotify(){if('Notification'in window)Notification.requestPermission().then(updateNotify)}function updateNotify(){notify.style.display=('Notification'in window&&Notification.permission==='granted')?'none':'block'}function send(title,body){if('Notification'in window&&Notification.permission==='granted')try{new Notification(title,{body})}catch(e){}}
function checkout(){if(!cart.length)return alert('กรุณาเลือกอาหารก่อนค่ะ 😊');let mins=3+Math.min(12,Math.ceil(cart.reduce((a,x)=>a+M[x.i][1]*x.q,0)/100));queue={created:Date.now(),duration:mins*60000,pick:pickup.value};localStorage.spuQueue=JSON.stringify(queue);cart=[];draw();closeCart();notice.classList.remove('hidden');send('SPU Canteen','รับออร์เดอร์แล้ว กำลังเตรียมอาหารค่ะ');start();alert('สั่งอาหารสำเร็จ 🎉\nเวลารับ '+queue.pick+'\nคาดว่าประมาณ '+mins+' นาทีถึงคิว')}
function start(){clearInterval(timer);update();timer=setInterval(update,1000)}function update(){if(!queue)return;let e=Date.now()-queue.created,r=Math.max(0,queue.duration-e),p=Math.min(100,e/queue.duration*100);bar.style.width=p+'%';if(r<=0){qtext.textContent='ถึงคิวแล้ว! 🎉 กรุณาไปรับอาหาร';qdetail.textContent='อาหารของคุณพร้อมรับแล้ว';send('🔔 SPU Canteen • ถึงคิวแล้ว!','อาหารของคุณพร้อมรับแล้ว กรุณาไปรับที่ร้าน');clearInterval(timer);queue=null;localStorage.removeItem('spuQueue');return}qtext.textContent='กำลังเตรียมอาหาร • เหลือประมาณ '+Math.ceil(r/60000)+' นาที';qdetail.textContent='เวลารับที่เลือก: '+queue.pick;updateNotify()}render();draw();if(queue){notice.classList.remove('hidden');start()}
</script></body></html>
